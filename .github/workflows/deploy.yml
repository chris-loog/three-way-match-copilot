name: Deploy

# Runs after CI succeeded on main (or by hand, optionally for an older commit: that is the rollback).
# Logs in to Azure with OIDC: no secret is stored in GitHub. The three IDs below are not secrets; they are repository variables.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (leave empty for the latest main). Use an older commit to roll back.
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-three-way-match

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_APP: ${{ vars.CONTAINER_APP }}
      FUNCTION_APP: ${{ vars.FUNCTION_APP }}
    steps:
      - name: Check the repository variables
        run: |
          missing=0
          [ -z "${{ vars.AZURE_CLIENT_ID }}" ] && echo "::error::Repository variable AZURE_CLIENT_ID is not set" && missing=1
          [ -z "${{ vars.AZURE_TENANT_ID }}" ] && echo "::error::Repository variable AZURE_TENANT_ID is not set" && missing=1
          [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] && echo "::error::Repository variable AZURE_SUBSCRIPTION_ID is not set" && missing=1
          [ -z "$ACR_NAME" ] && echo "::error::Repository variable ACR_NAME is not set" && missing=1
          [ -z "$CONTAINER_APP" ] && echo "::error::Repository variable CONTAINER_APP is not set" && missing=1
          [ -z "$FUNCTION_APP" ] && echo "::error::Repository variable FUNCTION_APP is not set" && missing=1
          exit $missing

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Work out the commit to deploy
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --- Web app: image tagged with the commit, pushed to the registry, then the Container App moves to it ---
      - name: Log in to the registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push the web image
        run: |
          image="$ACR_NAME.azurecr.io/three-way-match-web:${{ steps.commit.outputs.sha }}"
          docker build -t "$image" .
          docker push "$image"

      - name: Update the Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/three-way-match-web:${{ steps.commit.outputs.sha }}" \
            --revision-suffix "r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

      # --- Function app: published as a package ---
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the Function
        run: dotnet publish src/ThreeWayMatch.Functions/ThreeWayMatch.Functions.csproj -c Release -o ./publish/functions

      - name: Deploy the Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP }}
          package: ./publish/functions
          sku: flexconsumption

      # --- Smoke test: the deployed site answers and its database, storage and queue work ---
      # The app scales to zero, so the first request waits for a cold start. Retry for up to three minutes.
      - name: Smoke test /health
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$fqdn/health"
          for attempt in $(seq 1 12); do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 30 "https://$fqdn/health" || echo 000)
            echo "attempt $attempt: HTTP $code"
            cat health.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then
              echo "### Deployed ${{ steps.commit.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
              echo "https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::/health did not return 200. If it names the database, run the migration bundle (see docs/deploy.md). To roll back, run this workflow by hand with an earlier commit."
          exit 1

      # --- Migration bundle: built on every deploy so the schema change that belongs to this commit is at hand ---
      # The workflow never applies it: the deploy identity has no rights on the database (least privilege).
      - name: Build the migration bundle
        if: always()
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations bundle \
            --project src/ThreeWayMatch.Infrastructure --startup-project src/ThreeWayMatch.Infrastructure \
            --self-contained -r linux-x64 --output ./efbundle --force

      - name: Upload the migration bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efbundle-${{ steps.commit.outputs.sha }}
          path: efbundle
          if-no-files-found: ignore
          retention-days: 30
